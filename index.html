<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>رانندگی در تهران 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9cbe4;font-family:Tahoma}
#game{position:fixed;inset:0}
canvas{display:block}

#hud{
position:fixed;top:12px;right:12px;
background:#101820dd;color:white;
padding:12px;border-radius:12px;z-index:5
}
#speed{font-size:27px;font-weight:bold}

#help{
position:fixed;top:12px;left:12px;
background:#101820dd;color:white;
padding:10px;border-radius:10px;z-index:5;font-size:12px
}

#status{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#101820ed;color:white;
padding:16px;border-radius:12px;
z-index:10;text-align:center;line-height:2
}

#controls{
position:fixed;bottom:18px;left:15px;right:15px;
display:flex;justify-content:space-between;
align-items:end;z-index:6;pointer-events:none
}
.pad{
display:grid;
grid-template-columns:55px 55px 55px;
grid-template-rows:55px 55px;gap:5px;
pointer-events:auto
}
.btn{
background:#17232ddd;color:white;
border:1px solid #ffffff88;
border-radius:13px;font-size:22px;
touch-action:none;user-select:none
}
.actions{display:flex;gap:8px;pointer-events:auto}
#gas,#brake{
width:68px;height:68px;border-radius:50%;
font-size:15px
}
#gas{background:#167a43}
#brake{background:#a52b2b}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
سرعت
<div><span id="speed">۰</span> KM/H</div>
</div>

<div id="help">
رانندگی در تهران 🏙️<br>
حرکت با دکمه‌ها
</div>

<div id="status">در حال ساخت شهر تهران...</div>

<div id="controls">
<div class="pad">
<span></span>
<button class="btn" data-key="ArrowUp">▲</button>
<span></span>
<button class="btn" data-key="ArrowLeft">◀</button>
<button class="btn" data-key="ArrowDown">▼</button>
<button class="btn" data-key="ArrowRight">▶</button>
</div>

<div class="actions">
<button class="btn" id="brake" data-key="Space">ترمز</button>
<button class="btn" id="gas" data-key="ArrowUp">گاز</button>
</div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">

async function startGame(){

const status=document.getElementById("status");

try{

const THREE=await import("three");
const {GLTFLoader}=await import("three/addons/loaders/GLTFLoader.js");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9cbe4);
scene.fog=new THREE.Fog(0xa9cbe4,100,350);

const camera=new THREE.PerspectiveCamera(
60,innerWidth/innerHeight,.1,1000
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,60,30);
sun.castShadow=true;
scene.add(sun);

function material(color){
return new THREE.MeshStandardMaterial({color,roughness:.85});
}

// زمین
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(1000,1000),
material(0x829879)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
scene.add(ground);

// خیابان اصلی
const road=new THREE.Mesh(
new THREE.PlaneGeometry(20,1000),
material(0x303238)
);
road.rotation.x=-Math.PI/2;
scene.add(road);

// پیاده‌رو
for(const x of [-11.5,11.5]){
const sidewalk=new THREE.Mesh(
new THREE.PlaneGeometry(3,1000),
material(0xbab5a8)
);
sidewalk.rotation.x=-Math.PI/2;
sidewalk.position.set(x,.03,0);
scene.add(sidewalk);
}

// خط‌کشی خیابان
for(let z=-490;z<500;z+=14){
const line=new THREE.Mesh(
new THREE.PlaneGeometry(.22,7),
new THREE.MeshBasicMaterial({color:0xffffff})
);
line.rotation.x=-Math.PI/2;
line.position.set(0,.04,z);
scene.add(line);
}

// ساختمان‌های تهران
const colors=[
0xc9b99e,0xd8d0c2,0xb8b4aa,
0xc7c1b5,0xa99e8d,0xd4c4a8
];

let index=0;

for(let z=-450;z<=450;z+=38){

for(const side of [-1,1]){

const w=12+(index%3)*3;
const h=14+(index%5)*5;
const d=22;

const x=side*(20+w/2);

const building=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
material(colors[index%colors.length])
);

building.position.set(x,h/2,z);
building.castShadow=true;
scene.add(building);

// پنجره‌ها
for(let floor=1;floor<h/3;floor++){
for(let col=0;col<3;col++){

const windowMesh=new THREE.Mesh(
new THREE.BoxGeometry(1.5,1.4,.08),
material(0x354c60)
);

windowMesh.position.set(
x-w/2+3+col*3,
floor*3,
z-d/2-.06
);

scene.add(windowMesh);

}
}

index++;

}
}

// چراغ‌های خیابان
for(let z=-400;z<400;z+=35){

for(const side of [-1,1]){

const pole=new THREE.Mesh(
new THREE.CylinderGeometry(.08,.1,5,8),
material(0x555555)
);

pole.position.set(side*10,2.5,z);
scene.add(pole);

const lamp=new THREE.Mesh(
new THREE.BoxGeometry(.8,.2,.4),
material(0xffe6a3)
);

lamp.position.set(side*10,4.8,z);
scene.add(lamp);

}
}

// درخت‌ها
for(let z=-400;z<400;z+=45){

for(const side of [-1,1]){

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.15,.2,2,8),
material(0x70462b)
);

trunk.position.set(side*13,1,z);
scene.add(trunk);

const leaves=new THREE.Mesh(
new THREE.SphereGeometry(1.3,10,8),
material(0x34713a)
);

leaves.position.set(side*13,2.7,z);
scene.add(leaves);

}
}

// ماشین موقت
function createTemporaryCar(){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2,0.8,4),
material(0xc51e35)
);
body.position.y=.8;
group.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(1.65,.8,1.9),
material(0x263c50)
);
cabin.position.set(0,1.55,-.25);
group.add(cabin);

for(const x of [-1,1]){
for(const z of [-1.3,1.3]){

const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.42,.42,.25,16),
material(0x171717)
);

wheel.rotation.z=Math.PI/2;
wheel.position.set(x, .45,z);
group.add(wheel);

}
}

return group;

}

let car=createTemporaryCar();
scene.add(car);

let wheels=[];
let realCar=false;

// بارگذاری ماشین واقعی
status.innerHTML="در حال بارگذاری ماشین...";

const loader=new GLTFLoader();

loader.load(
"./car.glb",

(gltf)=>{

try{

const model=gltf.scene;

const box=new THREE.Box3().setFromObject(model);
const size=box.getSize(new THREE.Vector3());
const center=box.getCenter(new THREE.Vector3());

const scale=4.5/Math.max(size.x,size.y,size.z);

model.scale.setScalar(scale);
model.position.set(
-center.x*scale,
-center.y*scale,
-center.z*scale
);

const newBox=new THREE.Box3().setFromObject(model);
model.position.y-=newBox.min.y;

model.traverse(obj=>{
if(obj.isMesh){
obj.castShadow=true;
obj.receiveShadow=true;

if(/wheel|tire|tyre|چرخ/i.test(obj.name)){
wheels.push(obj);
}
}
});

scene.remove(car);
car=model;
scene.add(car);
realCar=true;

status.innerHTML="ماشین واقعی بارگذاری شد! 🚗";

setTimeout(()=>status.style.display="none",2500);

}catch(error){
console.error(error);
status.innerHTML="ماشین موقت فعال است.";
setTimeout(()=>status.style.display="none",2500);
}

},

undefined,

(error)=>{

console.error("Car loading error:",error);

status.innerHTML="ماشین موقت فعال است؛ فایل GLB پیدا نشد.";
setTimeout(()=>status.style.display="none",3000);

}

);

// کنترل‌ها
const keys={};

function setKey(key,value){
keys[key]=value;
}

addEventListener("keydown",e=>{
setKey(e.code,true);
});

addEventListener("keyup",e=>{
setKey(e.code,false);
});

document.querySelectorAll("[data-key]").forEach(button=>{

const key=button.dataset.key;

button.addEventListener("pointerdown",e=>{
e.preventDefault();
button.setPointerCapture(e.pointerId);
setKey(key,true);
});

function release(e){
e.preventDefault();
setKey(key,false);
}

button.addEventListener("pointerup",release);
button.addEventListener("pointercancel",release);
button.addEventListener("lostpointercapture",release);

});

// رانندگی
let speed=0;
let steer=0;

const clock=new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.04);

const forward=keys.ArrowUp||keys.KeyW;
const backward=keys.ArrowDown||keys.KeyS;
const left=keys.ArrowLeft||keys.KeyA;
const right=keys.ArrowRight||keys.KeyD;

if(forward){
speed=Math.min(speed+8*dt,25);
}else if(backward||keys.Space){
speed=Math.max(speed-14*dt,-6);
}else{
speed*=Math.pow(.985,dt*60);
}

const steering=(left?1:0)-(right?1:0);

steer=THREE.MathUtils.lerp(
steer,steering,Math.min(1,dt*5)
);

car.rotation.y+=steer*speed*.018*dt;

car.position.x+=Math.sin(car.rotation.y)*speed*dt;
car.position.z+=Math.cos(car.rotation.y)*speed*dt;

wheels.forEach(w=>{
w.rotation.x+=speed*dt/.35;
});

document.getElementById("speed").textContent=
Math.round(Math.abs(speed)*3.6).toLocaleString("fa-IR");

// دوربین دنبال‌کننده
const offset=new THREE.Vector3(0,4,-9)
.applyAxisAngle(new THREE.Vector3(0,1,0),car.rotation.y);

const target=car.position.clone().add(offset);

camera.position.lerp(target,1-Math.pow(.001,dt));

camera.lookAt(
car.position.x,
car.position.y+1,
car.position.z
);

renderer.render(scene,camera);

}

animate();

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

status.innerHTML="به تهران خوش آمدی! 🏙️";
setTimeout(()=>status.style.display="none",2500);

}catch(error){

console.error(error);

status.style.display="block";
status.innerHTML="خطا در اجرای بازی!<br>"+error.message;

}

}

startGame();

</script>
</body>
 </html>

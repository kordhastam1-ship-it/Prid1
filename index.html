<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تهران رانندگی سه بعدی</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;
overflow:hidden;background:#a9cbe4;
font-family:Tahoma,Arial
}
#game{position:fixed;inset:0}
canvas{display:block}

#hud{
position:fixed;top:12px;right:12px;
background:#101820dd;color:white;
padding:12px 17px;border-radius:14px;
z-index:5
}
#speed{font-size:28px;font-weight:bold}

#help{
position:fixed;top:12px;left:12px;
background:#101820dd;color:white;
padding:10px;border-radius:12px;
font-size:12px;z-index:5;line-height:1.8
}

#status{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#101820ed;color:white;
padding:15px 20px;border-radius:14px;
z-index:10;text-align:center;line-height:2;
max-width:85%
}

#controls{
position:fixed;bottom:18px;
left:15px;right:15px;
display:flex;justify-content:space-between;
align-items:end;z-index:6;
pointer-events:none
}

#steering{
width:185px;height:185px;
border-radius:50%;
background:#101c2ddd;
border:10px solid #aaa;
display:flex;align-items:center;
justify-content:center;
pointer-events:auto;
touch-action:none;
}

#wheel{
width:165px;height:165px;
border-radius:50%;
border:15px solid #eee;
position:relative;
display:flex;align-items:center;
justify-content:center;
touch-action:none;
}

#wheel:before{
content:"";
position:absolute;
width:15px;height:65px;
background:#eee;
top:0;left:60px;
border-radius:10px;
}

.wheel-center{
width:55px;height:55px;
border-radius:50%;
background:#222;
display:flex;align-items:center;
justify-content:center;
}

.actions{
display:flex;gap:7px;
align-items:end;pointer-events:auto;
flex-wrap:wrap;
justify-content:flex-end;
}

.btn{
background:#17232ddd;color:white;
border:1px solid #ffffff88;
border-radius:13px;font-size:14px;
padding:12px;touch-action:none;
user-select:none;
}

#gas{
background:#128b45;
width:75px;height:75px;
border-radius:50%;font-weight:bold
}

#brake{
background:#b32929;
width:68px;height:68px;
border-radius:50%
}

#cameraBtn{background:#245b8b}

@media(max-width:450px){
#steering{width:145px;height:145px}
#wheel{width:125px;height:125px}
#wheel:before{left:45px;height:48px}
.wheel-center{width:45px;height:45px}
#controls{bottom:12px}
.btn{padding:9px}
#help{font-size:10px}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
سرعت خودرو
<div><span id="speed">۰</span> KM/H</div>
</div>

<div id="help">
🏙️ تهران بزرگ<br>
رانندگی آزاد<br>
فرمان لمسی
</div>

<div id="status">در حال ساخت شهر تهران...</div>

<div id="controls">

<div id="steering">
<div id="wheel">
<div class="wheel-center">🚗</div>
</div>
</div>

<div class="actions">
<button class="btn" id="cameraBtn">📷 دوربین بالا</button>
<button class="btn" id="brake">ترمز</button>
<button class="btn" id="gas">گاز</button>
</div>

</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>

<script type="module">

async function startGame(){

const status=document.getElementById("status");

try{

const THREE=await import("three");
const {GLTFLoader}=await import("three/addons/loaders/GLTFLoader.js");

// =================================
// تنظیمات اصلی
// =================================

const scene=new THREE.Scene();

scene.background=new THREE.Color(0xa9cbe4);
scene.fog=new THREE.Fog(0xa9cbe4,350,1600);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,.1,3000
);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.getElementById("game").appendChild(renderer.domElement);

// نور

scene.add(new THREE.HemisphereLight(
0xffffff,0x777777,2
));

const sun=new THREE.DirectionalLight(
0xffffff,2.2
);

sun.position.set(-100,150,80);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

function mat(color){
return new THREE.MeshStandardMaterial({
color,roughness:.9
});
}

// =================================
// زمین شهر
// =================================

const CITY=1800;
const STEP=180;
const ROAD=26;

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(2200,2200),
mat(0x839578)
);

ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
ground.receiveShadow=true;
scene.add(ground);

// =================================
// خیابان‌های شهر
// =================================

// خیابان‌های شمالی جنوبی

for(let x=-CITY/2;x<=CITY/2;x+=STEP){

const road=new THREE.Mesh(
new THREE.PlaneGeometry(ROAD,CITY),
mat(0x303238)
);

road.rotation.x=-Math.PI/2;
road.position.set(x,.01,0);
scene.add(road);

// خطوط کناری

for(const side of [-1,1]){

const line=new THREE.Mesh(
new THREE.PlaneGeometry(.15,CITY),
new THREE.MeshBasicMaterial({color:0xe8e8df})
);

line.rotation.x=-Math.PI/2;
line.position.set(x+side*11,.035,0);
scene.add(line);

}

}

// خیابان‌های شرقی غربی

for(let z=-CITY/2;z<=CITY/2;z+=STEP){

const road=new THREE.Mesh(
new THREE.PlaneGeometry(CITY,ROAD),
mat(0x303238)
);

road.rotation.x=-Math.PI/2;
road.position.set(0,.02,z);
scene.add(road);

}

// خط‌کشی

const dashMat=new THREE.MeshBasicMaterial({
color:0xf0e7c8
});

for(let x=-CITY/2;x<=CITY/2;x+=STEP){

for(let z=-CITY/2;z<CITY/2;z+=20){

const dash=new THREE.Mesh(
new THREE.PlaneGeometry(.22,8),
dashMat
);

dash.rotation.x=-Math.PI/2;
dash.position.set(x,.045,z);
scene.add(dash);

}

}

// =================================
// ساختمان‌های تهران
// =================================

const colors=[
0xc9b99e,
0xd8d0c2,
0xb8b4aa,
0xc7c1b5,
0xa99e8d,
0xd4c4a8,
0xaaaeb4
];

const windowMat=mat(0x354b60);

let buildingIndex=0;

function building(x,z,w,d,h,index){

const body=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
mat(colors[index%colors.length])
);

body.position.set(x,h/2,z);
body.castShadow=true;
body.receiveShadow=true;
scene.add(body);

// سقف

const roof=new THREE.Mesh(
new THREE.BoxGeometry(w+.3,.5,d+.3),
mat(0x88847c)
);

roof.position.set(x,h+.2,z);
scene.add(roof);

// پنجره‌ها

for(let floor=1;floor<h/3;floor++){

for(let col=0;col<3;col++){

const win=new THREE.Mesh(
new THREE.BoxGeometry(1.8,1.5,.09),
windowMat
);

win.position.set(
x-w/2+3+col*(w-5)/3,
floor*3,
z-d/2-.06
);

scene.add(win);

}

}

// ورودی مغازه

const shop=new THREE.Mesh(
new THREE.BoxGeometry(w*.65,2,.12),
mat(index%2?0x426d78:0x9c6041)
);

shop.position.set(x,1,z-d/2-.1);
scene.add(shop);

}

// ساخت محله‌ها

for(let ix=-5;ix<=5;ix++){

for(let iz=-5;iz<=5;iz++){

const cx=ix*STEP+STEP/2;
const cz=iz*STEP+STEP/2;

// ساختمان‌های هر محله

const positions=[
[cx-42,cz-42],
[cx+42,cz+42],
[cx-42,cz+42],
[cx+42,cz-42]
];

for(let p=0;p<positions.length;p++){

const w=25+(buildingIndex%3)*7;
const h=20+(buildingIndex%7)*9;
const d=28;

building(
positions[p][0],
positions[p][1],
w,d,h,
buildingIndex++
);

}

}

}

// =================================
// پارک‌ها
// =================================

for(let ix=-4;ix<=4;ix+=2){

for(let iz=-4;iz<=4;iz+=2){

const x=ix*STEP+90;
const z=iz*STEP+90;

const park=new THREE.Mesh(
new THREE.PlaneGeometry(48,48),
mat(0x43834b)
);

park.rotation.x=-Math.PI/2;
park.position.set(x,.04,z);
scene.add(park);

for(let i=0;i<6;i++){

const tx=x-15+(i%3)*15;
const tz=z-12+Math.floor(i/3)*22;

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.2,.3,3,8),
mat(0x70462b)
);

trunk.position.set(tx,1.5,tz);
scene.add(trunk);

const leaves=new THREE.Mesh(
new THREE.SphereGeometry(2.5,9,8),
mat(0x26723c)
);

leaves.position.set(tx,4,tz);
scene.add(leaves);

}

}

}

// =================================
// چراغ‌های خیابان
// =================================

for(let x=-CITY/2;x<=CITY/2;x+=STEP){

for(let z=-CITY/2;z<=CITY/2;z+=STEP){

for(const side of [-1,1]){

const pole=new THREE.Mesh(
new THREE.CylinderGeometry(.09,.12,5,8),
mat(0x444444)
);

pole.position.set(x+side*17,z===0?2.5:2.5,z+17);
scene.add(pole);

const lamp=new THREE.Mesh(
new THREE.BoxGeometry(1,.2,.5),
mat(0xffe8a8)
);

lamp.position.set(x+side*17,4.8,z+17);
scene.add(lamp);

}

}

}

// =================================
// ماشین اصلی کاربر
// =================================

let car=null;
let wheels=[];

const CAR_URL="./car.glb";

status.innerHTML="در حال بارگذاری ماشین اصلی...";

new GLTFLoader().load(

CAR_URL,

(gltf)=>{

try{

const model=gltf.scene;

const box=new THREE.Box3().setFromObject(model);
const size=box.getSize(new THREE.Vector3());
const center=box.getCenter(new THREE.Vector3());

if(size.length()===0){
throw new Error("مدل ماشین خالی است");
}

const scale=4.5/Math.max(size.x,size.y,size.z);

const wrapper=new THREE.Group();

model.scale.setScalar(scale);
model.position.set(
-center.x*scale,
-center.y*scale,
-center.z*scale
);

// اصلاح جهت مدل
if(size.x>size.z){
model.rotation.y=-Math.PI/2;
}

model.traverse(obj=>{

if(obj.isMesh){
obj.castShadow=true;
obj.receiveShadow=true;

if(/wheel|tire|tyre|چرخ/i.test(obj.name||"")){
wheels.push(obj);
}

}

});

wrapper.add(model);

// تنظیم ارتفاع ماشین
const finalBox=new THREE.Box3().setFromObject(wrapper);
wrapper.position.y-=finalBox.min.y;

car=wrapper;
scene.add(car);

status.innerHTML="ماشین اصلی شما آماده رانندگی است! 🚗";

setTimeout(()=>{
status.style.display="none";
},2500);

}catch(error){

console.error(error);
status.innerHTML="خطا در آماده‌سازی مدل ماشین: "+error.message;

}

},

undefined,

(error)=>{

console.error("GLB error:",error);

status.innerHTML=
"ماشین اصلی بارگذاری نشد!<br>فایل car.glb را بررسی کن.";

}

);

// =================================
// کنترل‌ها
// =================================

const keys={};

addEventListener("keydown",e=>{
keys[e.code]=true;
});

addEventListener("keyup",e=>{
keys[e.code]=false;
});

// گاز و ترمز

function holdButton(button,key){

button.addEventListener("pointerdown",e=>{
e.preventDefault();
button.setPointerCapture(e.pointerId);
keys[key]=true;
});

function release(){
keys[key]=false;
}

button.addEventListener("pointerup",release);
button.addEventListener("pointercancel",release);
button.addEventListener("lostpointercapture",release);

}

holdButton(document.getElementById("gas"),"ArrowUp");
holdButton(document.getElementById("brake"),"Space");

// =================================
// فرمان لمسی بزرگ
// =================================

const wheel=document.getElementById("wheel");

let steeringInput=0;
let dragging=false;
let lastX=0;

wheel.addEventListener("pointerdown",e=>{

dragging=true;
lastX=e.clientX;
wheel.setPointerCapture(e.pointerId);

});

wheel.addEventListener("pointermove",e=>{

if(!dragging)return;

const delta=e.clientX-lastX;

steeringInput=THREE.MathUtils.clamp(
steeringInput+delta*.025,
-1,1
);

lastX=e.clientX;

});

function releaseSteering(){
dragging=false;
}

wheel.addEventListener("pointerup",releaseSteering);
wheel.addEventListener("pointercancel",releaseSteering);
wheel.addEventListener("lostpointercapture",releaseSteering);

// =================================
// دوربین
// =================================

let cameraMode=0;

document.getElementById("cameraBtn").onclick=()=>{

cameraMode=(cameraMode+1)%2;

document.getElementById("cameraBtn").textContent=
cameraMode===0?"📷 دوربین بالا":"📷 دوربین پشت";

};

// =================================
// رانندگی آرکید
// =================================

let speed=0;
let steer=0;

const clock=new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.04);

// فقط وقتی ماشین واقعی بارگذاری شده

if(car){

const forward=keys.ArrowUp||keys.KeyW;
const backward=keys.ArrowDown||keys.KeyS;
const left=keys.ArrowLeft||keys.KeyA;
const right=keys.ArrowRight||keys.KeyD;

// شتاب قوی

if(forward){
speed=Math.min(speed+18*dt,42);
}
else if(backward){
speed=Math.max(speed-20*dt,-12);
}
else if(keys.Space){
speed=Math.max(speed-28*dt,0);
}
else{
speed*=Math.pow(.992,dt*60);
}

// فرمان

const keyboardSteer=
(left?1:0)-(right?1:0);

const targetSteer=
keyboardSteer!==0?keyboardSteer:steeringInput;

steer=THREE.MathUtils.lerp(
steer,targetSteer,
Math.min(1,dt*9)
);

// برگشت فرمان به مرکز

if(!dragging){
steeringInput*=Math.pow(.94,dt*60);
}

wheel.style.transform=
`rotate(${steeringInput*180}deg)`;

// چرخش آرکید

const turnPower=.045;

car.rotation.y+=
steer*turnPower*
Math.min(Math.abs(speed)/8,1.5)*
Math.sign(speed||1)*dt*60;

// حرکت

car.position.x+=
Math.sin(car.rotation.y)*speed*dt;

car.position.z+=
Math.cos(car.rotation.y)*speed*dt;

// چرخ‌های ماشین

wheels.forEach(w=>{
w.rotation.x+=speed*dt/.35;
});

// نمایش سرعت

document.getElementById("speed").textContent=
Math.round(Math.abs(speed)*3.6).toLocaleString("fa-IR");

// دوربین بالایی یا عقب

let offset;

if(cameraMode===0){

// نمای بالا

offset=new THREE.Vector3(0,26,-4);

}else{

// پشت ماشین

offset=new THREE.Vector3(0,6,-13);

}

offset.applyAxisAngle(
new THREE.Vector3(0,1,0),
car.rotation.y
);

const target=car.position.clone().add(offset);

camera.position.lerp(
target,
1-Math.pow(.001,dt)
);

camera.lookAt(
car.position.x,
car.position.y,
car.position.z
);

}

renderer.render(scene,camera);

}

animate();

// =================================
// تغییر اندازه صفحه
// =================================

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

}catch(error){

console.error(error);

status.style.display="block";
status.innerHTML="خطا در اجرای بازی:<br>"+error.message;

}

}

startGame();

</script>

</body>
 </html>
